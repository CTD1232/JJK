    cooldown: 90
    radius: 20
    duration: 10
    upkeep: 10
    damage: 4          # per hit, ignores Infinity
    barrier: false     # the real Malevolent Shrine has no barrier
    shell: RED_TERRACOTTA
    shrine_scale: 6    # shrine model size multiplier (6 = about 18 blocks wide)
    shrine_distance: 9 # how far in front of you it appears
  reverse_cursed_technique:
    name: "Reverse Cursed Technique"
    cost: 15           # cost to start (stopping is free)
    cooldown: 1
    pulse_cost: 6
    pulse_ticks: 5
    heal_per_pulse: 1.0
  simple_domain:
    name: "Simple Domain"
    cost: 120
    cooldown: 20
    duration: 5
  # ---- Megumi / Ten Shadows ----
  divine_dogs:
    name: "Divine Dogs"
    cost: 90
    cooldown: 20
    duration: 40
    damage: 6
    health: 30
  nue:
    name: "Nue"
    cost: 110
    cooldown: 25
    duration: 15
    size: 3
    damage: 6
    shock_damage: 8
  toad:
    name: "Toad"
    cost: 40
    cooldown: 6
    range: 20
    pull: 1.3
    slow_seconds: 3
  max_elephant:
    name: "Max: Elephant"
    cost: 130
    cooldown: 15
    range: 12
    damage: 6
    knockback: 1.8
  rabbit_escape:
