# JujutsuCraft config. Everything here is live-reloadable with /jjk reload.
# Cooldowns are in seconds, durations in seconds, costs in cursed energy (CE).

energy:
  max: 1000          # default max CE for new players
  regen: 6           # CE regained per second
  actionbar: true    # show CE while holding a JJK item

# Custom-model visuals (orbs, slashes, shrine, elephant, starfield...). Needs the resource pack on clients;
# without it they appear as floating paper. Set false to fall back to particles/blocks only.
visuals:
  enabled: true

# Optional: send the resource pack to players on join. Host JujutsuCraft-Pack.zip (e.g. a GitHub release)
# and paste its direct link here. sha1 is the 40-char hash of the zip (optional but recommended).
resource_pack:
  url: ""
  sha1: ""

# Items. Triggers: right_click, shift_right_click, left_click, shift_left_click, swap, shift_swap
# (swap = the swap-hands key, F by default). Values are technique ids from the "techniques" section.
# "model" is a custom_model_data value for your resource pack.
items:
  gojo_blindfold:
    material: BLACK_DYE
    name: "&b&lSix Eyes Blindfold"
    model: 7001
    glow: true
    lore:
      - "&7The strongest sorcerer's blindfold."
    abilities:
      right_click: gojo_blue
      shift_right_click: gojo_red
      left_click: gojo_purple
      shift_left_click: unlimited_void
      swap: gojo_infinity
  sukuna_finger:
