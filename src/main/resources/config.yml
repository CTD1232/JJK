techniques:
  gojo_blue:
    name: "Cursed Technique Lapse: Blue"
    cost: 80
    cooldown: 6
    range: 25          # how far the aim point can be
    radius: 7          # pull radius
    pull: 0.7          # pull strength
    duration: 3        # seconds the singularity lasts
    damage: 2          # damage dealt twice a second near the core
  gojo_red:
    name: "Cursed Technique Reversal: Red"
    cost: 120
    cooldown: 8
    range: 45
    speed: 1.6
    power: 4.0         # explosion power
    break_blocks: false
  gojo_purple:
    name: "Hollow Purple"
    cost: 400
    cooldown: 30
    charge: 1.2        # seconds of charging
    range: 50
    speed: 2.5
    radius: 3.5
    damage: 40
    break_blocks: false
    carve_radius: 3
  gojo_infinity:
    name: "Infinity"
    cost: 40           # cost to turn on (turning off is free)
    cooldown: 0.5
    upkeep: 4          # CE per second while active
    hit_cost: 8        # CE per blocked hit
    repel_radius: 4
  unlimited_void:
    name: "Domain Expansion: Unlimited Void"
    cost: 350
    cooldown: 90
    radius: 14
    duration: 12
    upkeep: 10
    dome: true         # starfield room model; false = block shell
    shell: BLACK_CONCRETE
  dismantle:
    name: "Dismantle"
    cost: 30
    cooldown: 1.5
    range: 25
    width: 1.5
    damage: 7
  cleave:
    name: "Cleave"
    cost: 70
    cooldown: 5
    range: 20
    base_damage: 6
    health_scale: 0.35 # extra damage = target's current health * this
  fuga:
